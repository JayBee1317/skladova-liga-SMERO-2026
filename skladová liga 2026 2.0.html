<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skladová Liga 2026 – Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 29, 47, 0.85);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.4);
            --silver: #cbd5e1;
            --silver-glow: rgba(203, 213, 225, 0.3);
            --bronze: #fb8500;
            --bronze-glow: rgba(251, 133, 0, 0.3);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.3);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 183, 3, 0.08) 0%, transparent 50%);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Sekce pro přihlášení */
        .login-bar {
            background: var(--card-bg);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 15px var(--cyan-glow);
            border-radius: 50px;
            padding: 8px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-bar label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--cyan);
        }

        .login-bar select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            cursor: pointer;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--cyan), #0284c7);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--cyan-glow);
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Layout */
        .main-layout {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1300px;
            align-items: flex-start;
        }

        .levels-panel {
            flex: 0 0 300px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .levels-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--cyan);
            text-align: center;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .level-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1rem;
        }

        .level-row:last-child { border-bottom: none; }
        .level-name { font-weight: 700; }
        .level-pts { font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 0.9rem; }

        .leaderboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 20px;
            display: grid;
            grid-template-columns: 50px 1fr 180px 130px;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .active-user-highlight {
            border: 2px solid var(--green) !important;
            box-shadow: 0 0 20px var(--green-glow) !important;
            transform: scale(1.02);
        }

        .rank-1 { border: 1px solid var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
        .rank-2 { border: 1px solid var(--silver); box-shadow: 0 0 15px var(--silver-glow); }
        .rank-3 { border: 1px solid var(--bronze); box-shadow: 0 0 15px var(--bronze-glow); }

        .rank-number { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; color: #475569; }
        .rank-1 .rank-number { color: var(--gold); }
        .rank-2 .rank-number { color: var(--silver); }
        .rank-3 .rank-number { color: var(--bronze); }

        .player-name { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; }
        .player-tag { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #94a3b8; }

        .next-rank-info { text-align: right; padding-right: 15px; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .next-rank-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
        .next-rank-val { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #e2e8f0; font-weight: 700; }

        .score-container { text-align: right; font-family: 'Orbitron', sans-serif; }
        .score-value { font-size: 1.8rem; font-weight: 900; color: var(--cyan); }
        .score-label { font-size: 0.65rem; color: #64748b; }

        /* MODÁLNÍ OKNO / ANIMACE HÁČE */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .player-popup {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 40px var(--cyan-glow);
            border-radius: 20px;
            padding: 35px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            transform: scale(0.7) translateY(50px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .player-popup {
            transform: scale(1) translateY(0);
        }

        .badge-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--bronze));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .popup-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .popup-rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .reward-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--green);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--green-glow);
        }

        .reward-label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reward-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 10px var(--green-glow);
        }

        .close-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn:hover { background: #475569; }

        footer { margin-top: 25px; font-family: 'Orbitron', sans-serif; color: #475569; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- BAR PRO PŘIHLÁŠENÍ -->
    <div class="login-bar">
        <label for="user-select">🎮 HRÁČ:</label>
        <select id="user-select">
            <option value="">-- Vyber jméno --</option>
        </select>
        <button class="login-btn" onclick="PrihlasitUzivatele()">PŘIHLÁSIT SE</button>
    </div>

    <header>
        <h1>🏆 SKLADOVÁ LIGA 2026 🏆</h1>
        <div class="subtitle">▶ AKTUÁLNÍ ŽEBRÍČEK VÝSLEDKŮ ◀</div>
    </header>

    <div class="main-layout">
        <!-- LEVÝ PANEL -->
        <div class="levels-panel">
            <h2>📜 PŘEHLED ÚROVNÍ</h2>
            <div id="levels-list"></div>
        </div>

        <!-- HLAVNÍ ŽEBRÍČEK -->
        <div class="leaderboard-container" id="board"></div>
    </div>

    <!-- POPUP KARTA PO PŘIHLÁŠENÍ -->
    <div class="modal-overlay" id="modal">
        <div class="player-popup">
            <div class="badge-icon" id="pop-badge">🎖️</div>
            <div class="popup-name" id="pop-name">Jméno Hráče</div>
            <div class="popup-rank" id="pop-rank">ÚROVEŇ: BAZA</div>
            
            <div class="reward-box">
                <div class="reward-label">Aktuální nárok na odměnu:</div>
                <div class="reward-value" id="pop-reward">0 Kč</div>
            </div>

            <div style="font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;">
                Aktuálně nahráno: <span id="pop-pts" style="color: var(--cyan); font-weight: bold;">0</span> bodů
            </div>

            <button class="close-btn" onclick="ZavritModal()">ZAVŘÍT TUTO KARTU</button>
        </div>
    </div>

    <footer>
        POSLEDNÍ AKTUALIZACE: <span id="last-update" style="color: var(--cyan);">--:--:--</span>
    </footer>

    <script>
        // Definice úrovní a odměn v Kč z vaší tabulky
        const urovne = [
            { nazev: "Bronz II", body: 60, odmena: "400 Kč", ikona: "🥉" },
            { nazev: "Bronz I", body: 130, odmena: "600 Kč", ikona: "🥉" },
            { nazev: "Stříbrná II", body: 210, odmena: "800 Kč", ikona: "🥈" },
            { nazev: "Stříbrná I", body: 300, odmena: "1 000 Kč", ikona: "🥈" },
            { nazev: "Zlatá II", body: 400, odmena: "1 400 Kč", ikona: "🥇" },
            { nazev: "Zlatá I", body: 500, odmena: "1 600 Kč", ikona: "🥇" },
            { nazev: "Platinová", body: 620, odmena: "2 000 Kč", ikona: "💎" },
            { nazev: "Diamantová", body: 740, odmena: "2 400 Kč", ikona: "🔷" },
            { nazev: "Expert skladu", body: 850, odmena: "3 000 Kč", ikona: "⭐" },
            { nazev: "Mistr skladu", body: 930, odmena: "3 600 Kč", ikona: "👑" },
            { nazev: "Legenda skladu", body: 1100, odmena: "4 000 Kč", ikona: "🔥" }
        ];

        // Seznam pracovníků
        const tym = [
            { jmeno: "Císařová Eva", body: 645 },
            { jmeno: "Jarkovský Dominik", body: 435 },
            { jmeno: "Kačerková Blanka", body: 415 },
            { jmeno: "Gruna Jiří", body: 410 },
            { jmeno: "Blahová Michaela", body: 390 },
            { jmeno: "Kučerová Veronika", body: 365 },
            { jmeno: "Janovská Petra", body: 365 },
            { jmeno: "Kupková Kateřina", body: 325 },
            { jmeno: "Měřínská Eva", body: 270 },
            { jmeno: "Ferbyová Vendula", body: 265 },
            { jmeno: "Fialová Andrea", body: 265 },
            { jmeno: "Durbocková Růžena", body: 260 },
            { jmeno: "Došková Eva", body: 245 },
            { jmeno: "Filip Karel", body: 235 },
            { jmeno: "Mahovský Pavel", body: 210 },
            { jmeno: "Neubauer Jan", body: 210 },
            { jmeno: "Pavlů Zdeněk", body: 210 },
            { jmeno: "Sedlínská Martina", body: 205 },
            { jmeno: "Beran Ondřej", body: 200 },
            { jmeno: "Křejpská Gábina", body: 200 },
            { jmeno: "Novotný Radim", body: 200 },
            { jmeno: "Bednářová Sabina", body: 190 },
            { jmeno: "Bednářová Helena", body: 190 },
            { jmeno: "Čechovičová Jana", body: 175 },
            { jmeno: "Brablecová Olena", body: 170 },
            { jmeno: "Maršálková Žaneta", body: 140 },
            { jmeno: "Prokopová Veronika", body: 120 },
            { jmeno: "Málková Sabina", body: 110 },
            { jmeno: "Furchová Anna", body: 100 },
            { jmeno: "Přikryl Jan", body: 90 },
            { jmeno: "Cicálková Eliška", body: 75 }
        ];

        let prihlasenyUzivatel = null;

        function ZiskejUrovenData(body) {
            let aktualni = "Začátečník";
            let odmena = "0 Kč";
            let ikona = "🛡️";
            let dalsi = urovne[0];

            for (let i = 0; i < urovne.length; i++) {
                if (body >= urovne[i].body) {
                    aktualni = urovne[i].nazev;
                    odmena = urovne[i].odmena;
                    ikona = urovne[i].ikona;
                    dalsi = urovne[i + 1] || null;
                } else {
                    if (i === 0) dalsi = urovne[0];
                    break;
                }
            }
            return { aktualni, odmena, ikona, dalsi };
        }

        function NaplnSelect() {
            const select = document.getElementById('user-select');
            // Seřadíme jména abecedně pro snadný výběr
            const serazenaJmena = [...tym].sort((a,b) => a.jmeno.localeCompare(b.jmeno));
            serazenaJmena.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.jmeno;
                opt.innerText = p.jmeno;
                select.appendChild(opt);
            });
        }

        function Render() {
            // Render úrovní
            const levelsList = document.getElementById('levels-list');
            levelsList.innerHTML = '';
            urovne.forEach(u => {
                levelsList.innerHTML += `
                    <div class="level-row">
                        <span class="level-name">${u.ikona} ${u.nazev}</span>
                        <span class="level-pts">${u.body} PTS (${u.odmena})</span>
                    </div>
                `;
            });

            // Render žebříčku
            tym.sort((a, b) => b.body - a.body);
            const board = document.getElementById('board');
            board.innerHTML = '';

            tym.forEach((player, index) => {
                const rankNum = index + 1;
                let rankClass = '';
                if (rankNum === 1) rankClass = 'rank-1';
                else if (rankNum === 2) rankClass = 'rank-2';
                else if (rankNum === 3) rankClass = 'rank-3';

                if (prihlasenyUzivatel === player.jmeno) {
                    rankClass += ' active-user-highlight';
                }

                const levelData = ZiskejUrovenData(player.body);
                
                let nextRankText = "";
                if (levelData.dalsi) {
                    const chybi = levelData.dalsi.body - player.body;
                    nextRankText = `<span style="color: var(--cyan);">+${chybi} pts</span> na ${levelData.dalsi.nazev}`;
                } else {
                    nextRankText = `<span style="color: var(--gold);">MAX LEVEL 🔥</span>`;
                }

                const card = document.createElement('div');
                card.className = `player-card ${rankClass}`;
                card.id = `card-${player.jmeno.replace(/\s+/g, '')}`;
                card.innerHTML = `
                    <div class="rank-number">#${rankNum}</div>
                    <div class="player-info">
                        <div class="player-name">${player.jmeno}</div>
                        <div class="player-tag">${levelData.ikona} ${levelData.aktualni}</div>
                    </div>
                    <div class="next-rank-info">
                        <div class="next-rank-label">Chybí do další:</div>
                        <div class="next-rank-val">${nextRankText}</div>
                    </div>
                    <div class="score-container">
                        <div class="score-value">${player.body}</div>
                        <div class="score-label">BODŮ</div>
                    </div>
                `;
                board.appendChild(card);
            });

            const now = new Date();
            document.getElementById('last-update').innerText = now.toLocaleTimeString('cs-CZ');
        }

        function PrihlasitUzivatele() {
            const jmeno = document.getElementById('user-select').value;
            if (!jmeno) return;

            prihlasenyUzivatel = jmeno;
            const hrac = tym.find(t => t.jmeno === jmeno);
            const levelData = ZiskejUrovenData(hrac.body);

            // Naplnit Popup okno
            document.getElementById('pop-name').innerText = hrac.jmeno;
            document.getElementById('pop-rank').innerText = `${levelData.ikona} ÚROVEŇ: ${levelData.aktualni}`;
            document.getElementById('pop-reward').innerText = levelData.odmena;
            document.getElementById('pop-pts').innerText = hrac.body;
            document.getElementById('pop-badge').innerText = levelData.ikona;

            // Zobrazit modal
            document.getElementById('modal').classList.add('active');

            // Prekreslit zebricek (zvýrazní hráče)
            Render();
        }

        function ZavritModal() {
            document.getElementById('modal').classList.remove('active');
        }

        NaplnSelect();
        Render();
    </script>
</body>
</html>
