<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skladová Liga 2026 – Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(15, 23, 42, 0.75);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.5);
            --silver: #e2e8f0;
            --silver-glow: rgba(226, 232, 240, 0.3);
            --bronze: #f97316;
            --bronze-glow: rgba(249, 115, 22, 0.4);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --purple: #a855f7;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.5);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.4);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 10% 50%, rgba(255, 183, 3, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .login-bar {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            border-radius: 50px;
            padding: 10px 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(12px);
        }

        .login-bar label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .login-bar select {
            background: #090d16;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            cursor: pointer;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            border: none;
            padding: 9px 24px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #fff 30%, var(--cyan) 70%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1350px;
            align-items: flex-start;
        }

        .levels-panel {
            flex: 0 0 320px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .levels-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--cyan);
            text-align: center;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .level-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.05rem;
        }

        .level-row:last-child { border-bottom: none; }
        .level-name { font-weight: 700; }
        .level-pts { font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 0.9rem; }

        .leaderboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 24px;
            display: grid;
            grid-template-columns: 55px 1fr 190px 130px;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-card:hover {
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .active-user-highlight {
            border: 2px solid var(--green) !important;
            box-shadow: 0 0 25px var(--green-glow) !important;
            transform: scale(1.02);
        }

        .disqualified-card {
            opacity: 0.5;
            background: rgba(30, 10, 10, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.3) !important;
        }

        .disqualified-card .player-name {
            text-decoration: line-through;
            color: #ef4444;
        }

        .rank-1 { border: 1px solid var(--gold); box-shadow: 0 0 25px var(--gold-glow); background: linear-gradient(90deg, rgba(255, 183, 3, 0.12) 0%, var(--card-bg) 60%); }
        .rank-2 { border: 1px solid var(--silver); box-shadow: 0 0 20px var(--silver-glow); background: linear-gradient(90deg, rgba(226, 232, 240, 0.08) 0%, var(--card-bg) 60%); }
        .rank-3 { border: 1px solid var(--bronze); box-shadow: 0 0 20px var(--bronze-glow); background: linear-gradient(90deg, rgba(249, 115, 22, 0.08) 0%, var(--card-bg) 60%); }

        .rank-number { font-family: 'Orbitron', sans-serif; font-size: 1.7rem; font-weight: 900; color: #475569; }
        .rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
        .rank-2 .rank-number { color: var(--silver); text-shadow: 0 0 10px var(--silver-glow); }
        .rank-3 .rank-number { color: var(--bronze); text-shadow: 0 0 10px var(--bronze-glow); }

        .player-name { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .player-tag { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: #94a3b8; }

        .next-rank-info { text-align: right; padding-right: 18px; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .next-rank-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .next-rank-val { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #e2e8f0; font-weight: 700; }

        .score-container { text-align: right; font-family: 'Orbitron', sans-serif; }
        .score-value { font-size: 1.9rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px var(--cyan-glow); }
        .score-label { font-size: 0.65rem; color: #64748b; letter-spacing: 2px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 12, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .player-popup {
            background: linear-gradient(145deg, #0f172a, #090d16);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 50px var(--cyan-glow);
            border-radius: 24px;
            padding: 35px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            transform: scale(0.8) translateY(30px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .player-popup { transform: scale(1) translateY(0); }

        .badge-icon {
            width: 85px; height: 85px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--bronze));
            display: flex; align-items: center; justify-content: center;
            font-size: 2.7rem;
            box-shadow: 0 0 30px var(--gold-glow);
        }

        .popup-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .popup-rank { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--gold); letter-spacing: 2px; margin-bottom: 20px; }

        .reward-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--green);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px var(--green-glow);
        }

        .reward-label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .reward-value { font-family: 'Orbitron', sans-serif; font-size: 2.3rem; font-weight: 900; color: var(--green); text-shadow: 0 0 12px var(--green-glow); }

        .close-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 28px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn:hover { background: #334155; transform: scale(1.03); }

        footer { margin-top: 30px; font-family: 'Orbitron', sans-serif; color: #475569; font-size: 0.85rem; letter-spacing: 1px; }

        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; }
            .levels-panel { width: 100%; box-sizing: border-box; }
            .player-card { grid-template-columns: 45px 1fr 110px; }
            .next-rank-info { display: none; }
        }
    </style>
</head>
<body>

    <div class="login-bar">
        <label for="user-select">🎮 HRÁČ:</label>
        <select id="user-select">
            <option value="">-- Vyber své jméno --</option>
        </select>
        <button class="login-btn" onclick="PrihlasitUzivatele()">PŘIHLÁSIT SE</button>
    </div>

    <header>
        <h1>🏆 SKLADOVÁ LIGA 2026 🏆</h1>
        <div class="subtitle">▶ AKTUÁLNÍ ŽEBRÍČEK VÝSLEDKŮ ◀</div>
    </header>

    <div class="main-layout">
        <div class="levels-panel">
            <h2>📜 PŘEHLED ÚROVNÍ</h2>
            <div id="levels-list"></div>
        </div>

        <div class="leaderboard-container" id="board"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="player-popup">
            <div class="badge-icon" id="pop-badge">🎖️</div>
            <div class="popup-name" id="pop-name">Jméno Hráče</div>
            <div class="popup-rank" id="pop-rank">ÚROVEŇ: BAZA</div>
            
            <div class="reward-box" id="pop-reward-box">
                <div class="reward-label">Aktuální nárok na odměnu:</div>
                <div class="reward-value" id="pop-reward">0 Kč</div>
            </div>

            <div style="font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #94a3b8; margin-bottom: 20px;">
                Aktuálně nahráno: <span id="pop-pts" style="color: var(--cyan); font-weight: bold;">0</span> bodů
            </div>

            <button class="close-btn" onclick="ZavritModal()">ZAVŘÍT KARTU</button>
        </div>
    </div>

    <footer>
        POSLEDNÍ AKTUALIZACE: <span id="last-update" style="color: var(--cyan);">--:--:--</span>
    </footer>

    <script>
        const urovne = [
            { nazev: "Bronz I", body: 60, odmena: "400 Kč", ikona: "🥉" },
            { nazev: "Bronz II", body: 130, odmena: "600 Kč", ikona: "🥉" },
            { nazev: "Stříbrná I", body: 210, odmena: "800 Kč", ikona: "🥈" },
            { nazev: "Stříbrná II", body: 300, odmena: "1 000 Kč", ikona: "🥈" },
            { nazev: "Zlatá I", body: 400, odmena: "1 400 Kč", ikona: "🥇" },
            { nazev: "Zlatá II", body: 500, odmena: "1 600 Kč", ikona: "🥇" },
            { nazev: "Platinová", body: 620, odmena: "2 000 Kč", ikona: "💎" },
            { nazev: "Diamantová", body: 740, odmena: "2 400 Kč", ikona: "🔷" },
            { nazev: "Expert skladu", body: 850, odmena: "3 000 Kč", ikona: "⭐" },
            { nazev: "Mistr skladu", body: 930, odmena: "3 600 Kč", ikona: "👑" },
            { nazev: "Legenda skladu", body: 1100, odmena: "4 000 Kč", ikona: "🔥" }
        ];

        // Seznam s novými daty a vyznačenou diskvalifikací
        const tym = [
            { jmeno: "Beran Ondřej", body: 230, diskvalifikovan: false },
            { jmeno: "Bednářová Sabina", body: 255, diskvalifikovan: false },
            { jmeno: "Bednářová Helena", body: 225, diskvalifikovan: false },
            { jmeno: "Blahová Michaela", body: 390, diskvalifikovan: false },
            { jmeno: "Brablecová Olena", body: 190, diskvalifikovan: false },
            { jmeno: "Cicálková Eliška", body: 75, diskvalifikovan: true },
            { jmeno: "Císařová Eva", body: 720, diskvalifikovan: false },
            { jmeno: "Čechovičová Jana", body: 220, diskvalifikovan: false },
            { jmeno: "Došková Eva", body: 245, diskvalifikovan: true },
            { jmeno: "Durbocková Růžena", body: 295, diskvalifikovan: false },
            { jmeno: "Ferbyová Vendula", body: 300, diskvalifikovan: false },
            { jmeno: "Fialová Andrea", body: 300, diskvalifikovan: false },
            { jmeno: "Filip Karel", body: 255, diskvalifikovan: false },
            { jmeno: "Furchová Anna", body: 135, diskvalifikovan: false },
            { jmeno: "Gruna Jiří", body: 410, diskvalifikovan: false },
            { jmeno: "Hudec Karel", body: 150, diskvalifikovan: true },
            { jmeno: "Kačerková Blanka", body: 460, diskvalifikovan: false },
            { jmeno: "Křejpská Gábina", body: 230, diskvalifikovan: false },
            { jmeno: "Kučerová Veronika", body: 420, diskvalifikovan: false },
            { jmeno: "Kupková Kateřina", body: 360, diskvalifikovan: false },
            { jmeno: "Janovská Petra", body: 500, diskvalifikovan: false },
            { jmeno: "Maršálková Žaneta", body: 170, diskvalifikovan: false },
            { jmeno: "Měřínská Eva", body: 315, diskvalifikovan: false },
            { jmeno: "Mahovský Pavel", body: 255, diskvalifikovan: true },
            { jmeno: "Neubauer Jan", body: 240, diskvalifikovan: false },
            { jmeno: "Novotný Radim", body: 230, diskvalifikovan: false },
            { jmeno: "Pavlů Zdeněk", body: 240, diskvalifikovan: false },
            { jmeno: "Jarkovský Dominik", body: 520, diskvalifikovan: false },
            { jmeno: "Sedlínská Martina", body: 235, diskvalifikovan: false },
            { jmeno: "Prokopová Veronika", body: 150, diskvalifikovan: false },
            { jmeno: "Přikryl Jan", body: 110, diskvalifikovan: true },
            { jmeno: "Málková Sabina", body: 155, diskvalifikovan: false }
        ];

        let prihlasenyUzivatel = null;

        function ZiskejUrovenData(body, diskvalifikovan) {
            if (diskvalifikovan) {
                return { aktualni: "DISKVALIFIKOVÁN", odmena: "0 Kč", ikona: "❌", dalsi: null };
            }

            let aktualni = "Začátečník";
            let odmena = "0 Kč";
            let ikona = "🛡️";
            let dalsi = urovne[0];

            for (let i = 0; i < urovne.length; i++) {
                if (body >= urovne[i].body) {
                    aktualni = urovne[i].nazev;
                    odmena = urovne[i].odmena;
                    ikona = urovne[i].ikona;
                    dalsi = urovne[i + 1] || null;
                } else {
                    if (i === 0) dalsi = urovne[0];
                    break;
                }
            }
            return { aktualni, odmena, ikona, dalsi };
        }

        function NaplnSelect() {
            const select = document.getElementById('user-select');
            const serazenaJmena = [...tym].sort((a,b) => a.jmeno.localeCompare(b.jmeno));
            serazenaJmena.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.jmeno;
                opt.innerText = p.diskvalifikovan ? `${p.jmeno} (Diskvalifikován)` : p.jmeno;
                select.appendChild(opt);
            });
        }

        function Render() {
            const levelsList = document.getElementById('levels-list');
            levelsList.innerHTML = '';
            urovne.forEach(u => {
                levelsList.innerHTML += `
                    <div class="level-row">
                        <span class="level-name">${u.ikona} ${u.nazev}</span>
                        <span class="level-pts">${u.body} PTS (${u.odmena})</span>
                    </div>
                `;
            });

            // Seřazení: Aktivní hráči podle bodů, diskvalifikovaní na konec
            tym.sort((a, b) => {
                if (a.diskvalifikovan && !b.diskvalifikovan) return 1;
                if (!a.diskvalifikovan && b.diskvalifikovan) return -1;
                return b.body - a.body;
            });

            const board = document.getElementById('board');
            board.innerHTML = '';

            tym.forEach((player, index) => {
                const rankNum = index + 1;
                let rankClass = '';
                
                if (!player.diskvalifikovan) {
                    if (rankNum === 1) rankClass = 'rank-1';
                    else if (rankNum === 2) rankClass = 'rank-2';
                    else if (rankNum === 3) rankClass = 'rank-3';
                } else {
                    rankClass = 'disqualified-card';
                }

                if (prihlasenyUzivatel === player.jmeno) {
                    rankClass += ' active-user-highlight';
                }

                const levelData = ZiskejUrovenData(player.body, player.diskvalifikovan);
                
                let nextRankText = "";
                if (player.diskvalifikovan) {
                    nextRankText = `<span style="color: var(--red);">MIMO SOUTĚŽ</span>`;
                } else if (levelData.dalsi) {
                    const chybi = levelData.dalsi.body - player.body;
                    nextRankText = `<span style="color: var(--cyan);">+${chybi} pts</span> na ${levelData.dalsi.nazev}`;
                } else {
                    nextRankText = `<span style="color: var(--gold);">MAX LEVEL 🔥</span>`;
                }

                const card = document.createElement('div');
                card.className = `player-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank-number">${player.diskvalifikovan ? '❌' : '#' + rankNum}</div>
                    <div class="player-info">
                        <div class="player-name">${player.jmeno}</div>
                        <div class="player-tag">${levelData.ikona} ${levelData.aktualni}</div>
                    </div>
                    <div class="next-rank-info">
                        <div class="next-rank-label">${player.diskvalifikovan ? 'STAV' : 'Chybí do další:'}</div>
                        <div class="next-rank-val">${nextRankText}</div>
                    </div>
                    <div class="score-container">
                        <div class="score-value" style="${player.diskvalifikovan ? 'color: #ef4444; text-shadow:none;' : ''}">${player.body}</div>
                        <div class="score-label">BODŮ</div>
                    </div>
                `;
                board.appendChild(card);
            });

            const now = new Date();
            document.getElementById('last-update').innerText = now.toLocaleTimeString('cs-CZ');
        }

        function PrihlasitUzivatele() {
            const jmeno = document.getElementById('user-select').value;
            if (!jmeno) return;

            prihlasenyUzivatel = jmeno;
            const hrac = tym.find(t => t.jmeno === jmeno);
            const levelData = ZiskejUrovenData(hrac.body, hrac.diskvalifikovan);

            document.getElementById('pop-name').innerText = hrac.jmeno;
            document.getElementById('pop-rank').innerText = `${levelData.ikona} ÚROVEŇ: ${levelData.aktualni}`;
            document.getElementById('pop-reward').innerText = levelData.odmena;
            document.getElementById('pop-pts').innerText = hrac.body;
            document.getElementById('pop-badge').innerText = levelData.ikona;

            const rewardBox = document.getElementById('pop-reward-box');
            if (hrac.diskvalifikovan) {
                rewardBox.style.borderColor = 'var(--red)';
                rewardBox.style.background = 'rgba(239, 68, 68, 0.1)';
            } else {
                rewardBox.style.borderColor = 'var(--green)';
                rewardBox.style.background = 'rgba(16, 185, 129, 0.1)';
            }

            document.getElementById('modal').classList.add('active');
            Render();
        }

        function ZavritModal() {
            document.getElementById('modal').classList.remove('active');
        }

        NaplnSelect();
        Render();
    </script>
</body>
</html>
