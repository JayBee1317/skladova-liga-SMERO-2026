<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skladová Liga 2026 – Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(15, 23, 42, 0.75);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.5);
            --silver: #e2e8f0;
            --silver-glow: rgba(226, 232, 240, 0.3);
            --bronze: #f97316;
            --bronze-glow: rgba(249, 115, 22, 0.4);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --purple: #a855f7;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.5);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.4);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 10% 50%, rgba(255, 183, 3, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* INTRO ANIMACE */
        #intro-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #03050a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        #intro-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .intro-content { animation: introZoom 2.8s ease-out forwards; padding: 0 20px; }

        .intro-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--cyan);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--cyan-glow);
            animation: pulseText 2s infinite alternate;
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ffffff 20%, var(--cyan) 60%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(0, 240, 255, 0.5);
            margin: 0 0 15px 0;
            line-height: 1.1;
        }

        .intro-smero {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 12px;
            text-shadow: 0 0 25px var(--gold-glow);
            border-top: 2px solid rgba(255, 183, 3, 0.3);
            border-bottom: 2px solid rgba(255, 183, 3, 0.3);
            padding: 10px 30px;
            display: inline-block;
        }

        .intro-loader {
            width: 200px; height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; margin-top: 40px;
            overflow: hidden; position: relative;
        }

        .intro-loader-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            box-shadow: 0 0 15px var(--cyan);
            animation: fillBar 2.5s ease-in-out forwards;
        }

        @keyframes introZoom {
            0% { opacity: 0; transform: scale(0.7) translateY(30px); filter: blur(10px); }
            30% { opacity: 1; filter: blur(0px); }
            80% { opacity: 1; transform: scale(1.05) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes pulseText { 0% { opacity: 0.7; text-shadow: 0 0 10px var(--cyan-glow); } 100% { opacity: 1; text-shadow: 0 0 25px var(--cyan-glow); } }

        #explosion-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10000;
        }

        /* PŘIHLAŠOVACÍ LIŠTA */
        .login-bar {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            border-radius: 50px;
            padding: 10px 24px; margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(12px);
        }

        .login-bar label { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--cyan); letter-spacing: 1px; }

        .login-bar select {
            background: #090d16; color: #fff; border: 1px solid #334155;
            padding: 8px 16px; border-radius: 20px;
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem;
            outline: none; cursor: pointer;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff; border: none; padding: 9px 24px; border-radius: 20px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }

        .login-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--cyan-glow); }

        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.2rem; margin: 0;
            text-transform: uppercase; letter-spacing: 5px;
            background: linear-gradient(135deg, #fff 30%, var(--cyan) 70%, var(--purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        .subtitle { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #94a3b8; letter-spacing: 4px; text-transform: uppercase; margin-top: 8px; }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            gap: 20px; width: 100%; max-width: 1600px; align-items: flex-start;
        }

        .panel-box {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
        }

        .panel-box h2 {
            font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin-top: 0; margin-bottom: 16px;
            color: var(--cyan); text-align: center; letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px;
        }

        .level-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1rem; }
        .level-row:last-child { border-bottom: none; }
        .level-name { font-weight: 700; }
        .level-pts { font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 0.85rem; }

        .leaderboard-container { display: flex; flex-direction: column; gap: 10px; }

        .player-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 12px 20px;
            display: grid; grid-template-columns: 50px 50px 1fr 60px 160px 110px;
            align-items: center; backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-card:hover { transform: translateX(4px); border-color: rgba(255, 255, 255, 0.2); }

        .active-user-highlight {
            border: 2px solid var(--green) !important;
            box-shadow: 0 0 25px var(--green-glow) !important;
            transform: scale(1.02);
        }

        .disqualified-card { opacity: 0.5; background: rgba(30, 10, 10, 0.6); border: 1px solid rgba(239, 68, 68, 0.3) !important; }
        .disqualified-card .player-name { text-decoration: line-through; color: #ef4444; }

        .rank-1 { border: 1px solid var(--gold); box-shadow: 0 0 25px var(--gold-glow); background: linear-gradient(90deg, rgba(255, 183, 3, 0.12) 0%, var(--card-bg) 60%); }
        .rank-2 { border: 1px solid var(--silver); box-shadow: 0 0 20px var(--silver-glow); background: linear-gradient(90deg, rgba(226, 232, 240, 0.08) 0%, var(--card-bg) 60%); }
        .rank-3 { border: 1px solid var(--bronze); box-shadow: 0 0 20px var(--bronze-glow); background: linear-gradient(90deg, rgba(249, 115, 22, 0.08) 0%, var(--card-bg) 60%); }

        .rank-number { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: #475569; }
        .rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
        .rank-2 .rank-number { color: var(--silver); text-shadow: 0 0 10px var(--silver-glow); }
        .rank-3 .rank-number { color: var(--bronze); text-shadow: 0 0 10px var(--bronze-glow); }

        .team-badge {
            font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 900;
            padding: 3px 8px; border-radius: 6px; text-align: center; width: fit-content;
            background: rgba(168, 85, 247, 0.2); border: 1px solid var(--purple); color: var(--purple);
        }

        .trend-badge {
            font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700;
            padding: 3px 6px; border-radius: 6px; text-align: center; width: fit-content;
        }

        .trend-up { color: #10b981; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
        .trend-down { color: #ef4444; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }
        .trend-same { color: #64748b; background: rgba(100, 116, 139, 0.15); border: 1px solid rgba(100, 116, 139, 0.3); }

        .player-name { font-size: 1.35rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .player-tag { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #94a3b8; }

        .next-rank-info { text-align: right; padding-right: 15px; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .next-rank-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .next-rank-val { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #e2e8f0; font-weight: 700; }

        .score-container { text-align: right; font-family: 'Orbitron', sans-serif; }
        .score-value { font-size: 1.7rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px var(--cyan-glow); }
        .score-label { font-size: 0.6rem; color: #64748b; letter-spacing: 2px; }

        /* TÝMOVÝ ŽEBRÍČEK */
        .team-card {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .team-rank { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: var(--gold); }
        .team-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
        .team-pts { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--cyan); }

        .category-tabs { display: flex; gap: 6px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 10px; }
        .cat-tab { flex: 1; border: none; background: transparent; color: #94a3b8; padding: 6px; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; cursor: pointer; border-radius: 8px; transition: all 0.2s; text-align: center; }
        .cat-tab.active { background: var(--cyan); color: #000; box-shadow: 0 0 10px var(--cyan-glow); }

        .category-card {
            background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; padding: 8px 12px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .cat-rank { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.9rem; color: var(--gold); width: 22px; }
        .cat-name { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; flex: 1; }
        .cat-score { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--cyan); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 12, 0.88); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .player-popup {
            background: linear-gradient(145deg, #0f172a, #090d16);
            border: 2px solid var(--cyan); box-shadow: 0 0 50px var(--cyan-glow);
            border-radius: 24px; padding: 35px; width: 90%; max-width: 480px;
            text-align: center; transform: scale(0.8) translateY(30px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .player-popup { transform: scale(1) translateY(0); }

        .badge-icon {
            width: 85px; height: 85px; margin: 0 auto 15px auto; border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--bronze));
            display: flex; align-items: center; justify-content: center;
            font-size: 2.7rem; box-shadow: 0 0 30px var(--gold-glow);
        }

        .popup-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .popup-rank { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--gold); letter-spacing: 2px; margin-bottom: 20px; }

        .reward-box {
            background: rgba(16, 185, 129, 0.1); border: 1px solid var(--green);
            border-radius: 14px; padding: 16px; margin-bottom: 20px; box-shadow: 0 0 20px var(--green-glow);
        }

        .reward-label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .reward-value { font-family: 'Orbitron', sans-serif; font-size: 2.3rem; font-weight: 900; color: var(--green); text-shadow: 0 0 12px var(--green-glow); }

        .close-btn {
            background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 28px; border-radius: 20px; font-family: 'Orbitron', sans-serif;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
        }

        .close-btn:hover { background: #334155; transform: scale(1.03); }

        footer { margin-top: 30px; font-family: 'Orbitron', sans-serif; color: #475569; font-size: 0.85rem; letter-spacing: 1px; }

        @media (max-width: 1200px) {
            .main-layout { grid-template-columns: 1fr; }
            .player-card { grid-template-columns: 40px 45px 1fr 100px; }
            .next-rank-info { display: none; }
        }
    </style>
</head>

    <canvas id="explosion-canvas"></canvas>

    <div id="intro-screen">
        <div class="intro-content">

            <h1 class="intro-title">SKLADOVÁ LIGA</h1>
            <div class="intro-smero">SMERO 2026</div>
            <div style="display: flex; justify-content: center;">
                <div class="intro-loader">
                    <div class="intro-loader-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="login-bar">
        <label for="user-select">🎮 HRÁČ:</label>
        <select id="user-select">
            <option value="">-- Vyber své jméno --</option>
        </select>
        <button class="login-btn" id="login-button" onclick="PrihlasitUzivateleWithAnimation()">
            <span id="btn-text">PŘIHLÁSIT SE</span>

    <header>

    <div class="main-layout">
        
        <div>
            <div class="panel-box">

            <div class="panel-box">
                <h2>📜 PŘEHLED ÚROVNÍ</h2>
                <div id="levels-list"></div>
            </div>
        </div>

        <div class="leaderboard-container" id="board"></div>

        <div class="panel-box">
            <h2>⭐ NEJLEPŠÍ V KATEGORIÍCH</h2>
            
            <div class="category-tabs">
                <button class="cat-tab active" onclick="ZmenKategorii('reklamace', this)">REKLAMACE</button>
                <button class="cat-tab" onclick="ZmenKategorii('dochazka', this)">DOCHÁZKA</button>
                <button class="cat-tab" onclick="ZmenKategorii('vykon', this)">VÝKON</button>
            </div>

            <div id="category-leaderboard"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">

            <div class="badge-icon" id="pop-badge">🎖️</div>
            <div class="popup-name" id="pop-name">Jméno Hráče</div>
            <div class="popup-rank" id="pop-rank">ÚROVEŇ: BAZA</div>
            
            <div class="reward-box" id="pop-reward-box">
                <div class="reward-label">Aktuální nárok na odměnu:</div>
                <div class="reward-value" id="pop-reward">0 Kč</div>
            </div>

            <div style="font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: #94a3b8; margin-bottom: 20px;">
                Aktuálně nahráno: <span id="pop-pts" style="color: var(--cyan); font-weight: bold;">0</span> bodů
            </div>

            <button class="close-btn" onclick="ZavritModal()">ZAVŘÍT KARTU</button>
        </div>
    </div>

    <footer>
        POSLEDNÍ AKTUALIZACE: <span id="last-update" style="color: var(--cyan);">--:--:--</span>
    </footer>

            { jmeno: "Košábková Kateřina", body: 30, posun: 0, tymNazev: "D", reklamace: 68, dochazka: 72, vykon: 68, diskvalifikovan: false },
            { jmeno: "Bajer Filip", body: 0, posun: 0, tymNazev: "C", reklamace: 50, dochazka: 50, vykon: 50, diskvalifikovan: false },
            { jmeno: "Tancerová Monika", body: 0, posun: 0, tymNazev: "D", reklamace: 50, dochazka: 50, vykon: 50, diskvalifikovan: false },
            { jmeno: "Tyl Nikola", body: 0, posun: 0, tymNazev: "M", reklamace: 50, dochazka: 50, vykon: 50, diskvalifikovan: false },
            { jmeno: "Minaříková Iveta", body: 0, posun: 0, tymNazev: "D", reklamace: 50, dochazka: 50, vykon: 50, diskvalifikovan: false },
            { jmeno: "Achilesová Vanesa", body: 0, posun: 0, tymNazev: "M", reklamace: 50, dochazka: 50, vykon: 50, diskvalifikovan: false }
        ];

        let prihlasenyUzivatel = null;
        let aktivniKategorie = 'reklamace';

        function ZiskejUrovenData(body, diskvalifikovan) {
            if (diskvalifikovan) {
                return { aktualni: "DISKVALIFIKOVÁN", odmena: "0 Kč", ikona: "❌", dalsi: null, levelTier: 0 };
            }

            let aktualni = "Začátečník";
            let odmena = "0 Kč";
            let ikona = "🛡️";
            let dalsi = urovne[0];
            let levelTier = 0;

            for (let i = 0; i < urovne.length; i++) {
                if (body >= urovne[i].body) {
                    aktualni = urovne[i].nazev;
                    odmena = urovne[i].odmena;
                    ikona = urovne[i].ikona;
                    dalsi = urovne[i + 1] || null;
                    levelTier = i + 1;
                } else {
                    if (i === 0) dalsi = urovne[0];
                    break;
                }
            }
            return { aktualni, odmena, ikona, dalsi, levelTier };
        }

        function NaplnSelect() {
            const select = document.getElementById('user-select');
            const serazenaJmena = [...tym].sort((a,b) => a.jmeno.localeCompare(b.jmeno));
            serazenaJmena.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.jmeno;
                opt.innerText = p.diskvalifikovan ? `${p.jmeno} (Diskvalifikován)` : p.jmeno;
                select.appendChild(opt);
            });
        }

        function RenderTymy() {
            const container = document.getElementById('teams-leaderboard');
            container.innerHTML = '';

            const tymyBody = { "C": 0, "D": 0, "M": 0 };

            tym.forEach(p => {
                if (!p.diskvalifikovan && tymyBody[p.tymNazev] !== undefined) {
                    tymyBody[p.tymNazev] += p.body;
                }
            });

            const serazeneTymy = Object.keys(tymyBody)
                .map(t => ({ nazev: `TÝM ${t}`, body: tymyBody[t] }))
                .sort((a, b) => b.body - a.body);

            serazeneTymy.forEach((t, idx) => {
                container.innerHTML += `
                    <div class="team-card">
                        <div class="team-rank">#${idx + 1}</div>
                        <div class="team-title">${t.nazev}</div>
                        <div class="team-pts">${t.body} PTS</div>
                    </div>
                `;
            });
        }

        function Render() {
            RenderTymy();

            const levelsList = document.getElementById('levels-list');
            levelsList.innerHTML = '';
            urovne.forEach(u => {
                levelsList.innerHTML += `
                    <div class="level-row">
                        <span class="level-name">${u.ikona} ${u.nazev}</span>
                        <span class="level-pts">${u.body} PTS (${u.odmena})</span>
                    </div>
                `;
            });

            tym.sort((a, b) => {
                if (a.diskvalifikovan && !b.diskvalifikovan) return 1;
                if (!a.diskvalifikovan && b.diskvalifikovan) return -1;
                return b.body - a.body;
            });

            const board = document.getElementById('board');
            board.innerHTML = '';

            tym.forEach((player, index) => {
                const rankNum = index + 1;
                let rankClass = '';
                
                if (!player.diskvalifikovan) {
                    if (rankNum === 1) rankClass = 'rank-1';
                    else if (rankNum === 2) rankClass = 'rank-2';
                    else if (rankNum === 3) rankClass = 'rank-3';
                } else {
                    rankClass = 'disqualified-card';
                }

                if (prihlasenyUzivatel === player.jmeno) {
                    rankClass += ' active-user-highlight';
                }

                const levelData = ZiskejUrovenData(player.body, player.diskvalifikovan);
                
                let trendHtml = "";
                if (!player.diskvalifikovan) {
                    if (player.posun > 0) trendHtml = `<div class="trend-badge trend-up">▲ +${player.posun}</div>`;
                    else if (player.posun < 0) trendHtml = `<div class="trend-badge trend-down">▼ ${player.posun}</div>`;
                    else trendHtml = `<div class="trend-badge trend-same">➖ 0</div>`;
                } else {
                    trendHtml = `<div class="trend-badge trend-down">❌</div>`;
                }

                let nextRankText = "";
                if (player.diskvalifikovan) {
                    nextRankText = `<span style="color: var(--red);">MIMO SOUTĚŽ</span>`;
                } else if (levelData.dalsi) {
                    const chybi = levelData.dalsi.body - player.body;
                    nextRankText = `<span style="color: var(--cyan);">+${chybi} pts</span> na ${levelData.dalsi.nazev}`;
                } else {
                    nextRankText = `<span style="color: var(--gold);">MAX LEVEL 🔥</span>`;
                }

                const card = document.createElement('div');
                card.className = `player-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank-number">${player.diskvalifikovan ? '❌' : '#' + rankNum}</div>
                    <div>${trendHtml}</div>
                    <div class="player-info">
                        <div class="player-name">${player.jmeno}</div>
                        <div class="player-tag">${levelData.ikona} ${levelData.aktualni}</div>
                    </div>
                    <div><span class="team-badge">TÝM ${player.tymNazev}</span></div>
                    <div class="next-rank-info">
                        <div class="next-rank-label">${player.diskvalifikovan ? 'STAV' : 'Chybí do další:'}</div>
                        <div class="next-rank-val">${nextRankText}</div>
                    </div>
                    <div class="score-container">
                        <div class="score-value" style="${player.diskvalifikovan ? 'color: #ef4444; text-shadow:none;' : ''}">${player.body}</div>
                        <div class="score-label">BODŮ</div>
                    </div>
                `;
                board.appendChild(card);
            });

            RenderKategorie();

            const now = new Date();
            document.getElementById('last-update').innerText = now.toLocaleTimeString('cs-CZ');
        }

        function RenderKategorie() {
            const container = document.getElementById('category-leaderboard');
            container.innerHTML = '';

            const aktivniHracis = tym.filter(t => !t.diskvalifikovan);
            aktivniHracis.sort((a, b) => b[aktivniKategorie] - a[aktivniKategorie]);

            aktivniHracis.slice(0, 10).forEach((hrac, idx) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="cat-rank">#${idx + 1}</div>
                    <div class="cat-name">${hrac.jmeno}</div>
                    <div class="cat-score">${hrac[aktivniKategorie]} pts</div>
                `;
                container.appendChild(card);
            });
        }

        function ZmenKategorii(kat, btn) {
            aktivniKategorie = kat;
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            RenderKategorie();
        }

        function PrihlasitUzivateleWithAnimation() {
            const jmeno = document.getElementById('user-select').value;
            if (!jmeno) return;

            const hrac = tym.find(t => t.jmeno === jmeno);
            const levelData = ZiskejUrovenData(hrac.body, hrac.diskvalifikovan);

            const btnText = document.getElementById('btn-text');
            btnText.innerText = "NAČÍTÁNÍ...";

            setTimeout(() => {
                TriggerExplosionByTier(levelData.levelTier);
                
                setTimeout(() => {
                    prihlasenyUzivatel = jmeno;

                    document.getElementById('pop-name').innerText = hrac.jmeno;
                    document.getElementById('pop-rank').innerText = `${levelData.ikona} ÚROVEŇ: ${levelData.aktualni}`;
                    document.getElementById('pop-reward').innerText = levelData.odmena;
                    document.getElementById('pop-pts').innerText = hrac.body;
                    document.getElementById('pop-badge').innerText = levelData.ikona;

                    const rewardBox = document.getElementById('pop-reward-box');
                    if (hrac.diskvalifikovan) {
                        rewardBox.style.borderColor = 'var(--red)';
                        rewardBox.style.background = 'rgba(239, 68, 68, 0.1)';
                    } else {
                        rewardBox.style.borderColor = 'var(--green)';
                        rewardBox.style.background = 'rgba(16, 185, 129, 0.1)';
                    }

                    document.getElementById('modal').classList.add('active');
                    btnText.innerText = "PŘIHLÁSIT SE";
                    Render();
                }, 400);
            }, 600);
        }

        function TriggerExplosionByTier(tier) {
            const canvas = document.getElementById('explosion-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (tier === 0) return;

            const particles = [];
            const shockwaves = [];

            let particleCount = 60;
            let speedMultiplier = 1;
            let colors = ['#f97316', '#ffb703'];

            if (tier >= 3 && tier <= 4) {
                particleCount = 120; speedMultiplier = 1.3;
                colors = ['#e2e8f0', '#00f0ff', '#ffffff'];
            } else if (tier >= 5 && tier <= 6) {
                particleCount = 220; speedMultiplier = 1.8;
                colors = ['#ffb703', '#f59e0b', '#ffffff', '#a855f7'];
                shockwaves.push({ r: 0, maxR: 350, alpha: 1, color: '#ffb703' });
            } else if (tier >= 7) {
                particleCount = 500; speedMultiplier = 2.8;
                colors = ['#00f0ff', '#a855f7', '#ffb703', '#10b981', '#ffffff', '#ec4899'];
                shockwaves.push({ r: 0, maxR: 600, alpha: 1, color: '#00f0ff' });
                shockwaves.push({ r: 0, maxR: 800, alpha: 0.8, color: '#a855f7' });
            }

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 18 + 4) * speedMultiplier;
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    size: Math.random() * (tier >= 7 ? 8 : 4) + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1, life: Math.random() * 0.02 + 0.01
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                shockwaves.forEach(sw => {
                    if (sw.alpha > 0) {
                        alive = true; sw.r += 20 * speedMultiplier; sw.alpha -= 0.025;
                        ctx.save(); ctx.beginPath();
                        ctx.arc(canvas.width / 2, canvas.height / 2, sw.r, 0, Math.PI * 2);
                        ctx.strokeStyle = sw.color; ctx.lineWidth = 6;
                        ctx.globalAlpha = Math.max(0, sw.alpha);
                        ctx.shadowBlur = 20; ctx.shadowColor = sw.color;
                        ctx.stroke(); ctx.restore();
                    }
                });

                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.96; p.vy *= 0.96;
                    p.alpha -= p.life;

                    if (p.alpha > 0) {
                        alive = true; ctx.save();
                        ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                        ctx.shadowBlur = tier >= 7 ? 15 : 8; ctx.shadowColor = p.color;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill(); ctx.restore();
                    }
                });

                if (alive) requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            animate();
        }

        function ZavritModal() {
            document.getElementById('modal').classList.remove('active');
        }

        NaplnSelect();
        Render();
    </script>
